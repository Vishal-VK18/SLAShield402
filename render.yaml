# Render Blueprint for SLAShield402 Full-Stack Deployment
# Deploys Backend Web Service (Hono + WebSocket on Node.js) and Frontend Static Site (React/Vite SPA)
services:
  # -------------------------------------------------------------
  # 1. Backend Web Service: SLAShield402 Firewall & Gateway API (Docker: Node.js 20 + Python 3.12)
  # -------------------------------------------------------------
  - type: web
    name: slashield402-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: SLASHIELD_RECIPIENT_ADDRESS
        value: YVEHNV3EWF4GULZHABH64QKOYLE5MO2MSBAAK7O76A2ESACA5OV2AZSOKQ
      - key: SLASHIELD_ESCROW_APP_ID
        value: "769236555"
      - key: USDC_ASA_ID
        value: "10458941"
      - key: FACILITATOR_URL
        value: https://facilitator.goplausible.xyz
      - key: ALGOD_SERVER
        value: https://testnet-api.algonode.cloud
      - key: ALGOD_PORT
        value: "443"
      - key: ALGOD_TOKEN
        value: ""
      - key: INDEXER_SERVER
        value: https://testnet-idx.algonode.cloud
      - key: INDEXER_PORT
        value: "443"
      - key: INDEXER_TOKEN
        value: ""
      - key: DEPLOYER_MNEMONIC
        sync: false
      - key: NODE_ENV
        value: production
      - key: SELF_BASE_URL
        value: https://slashield402-api.onrender.com

  # -------------------------------------------------------------
  # 2. Frontend Static Site: SLAShield402 React/Vite Dashboard
  # -------------------------------------------------------------
  - type: web
    name: slashield402-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://slashield402-api.onrender.com
      - key: VITE_WS_URL
        value: wss://slashield402-api.onrender.com/ws
